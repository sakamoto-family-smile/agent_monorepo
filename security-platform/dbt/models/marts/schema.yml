version: 2

models:
  - name: mart_source_freshness
    description: 情報源ごとの最終成功時刻・24 時間の実行件数と失敗数
    columns:
      - name: source
        data_tests: [unique, not_null]
  - name: mart_advisory_lead_time
    description: CVE が各情報源 (GHSA / PYSEC / DSA / KEV ...) に載った時刻と最初からの遅れ
  - name: mart_advisories_by_ecosystem
    description: エコシステムごとの Advisory 件数と深刻度の内訳 (悪性パッケージは malicious 列に分け、深刻度の内訳は取り下げ済みを除いた脆弱性だけで数える)
    columns:
      - name: ecosystem
        data_tests: [unique, not_null]
  - name: mart_kev_coverage
    description: KEV 掲載 CVE のうちパッケージ単位で照合できるもの
    columns:
      - name: cve
        data_tests: [unique, not_null]
  - name: mart_daily_changes
    description: 日別・変化の種類別の件数
  - name: mart_open_findings
    description: 未対応の Finding (優先度・期限順、期限切れと残り日数つき)
  - name: mart_findings_by_service
    description: サービスごとの未対応件数 (優先度別・修正版あり・期限切れ)
    columns:
      - name: service_id
        data_tests: [unique, not_null]
