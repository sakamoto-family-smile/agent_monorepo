# security-platform 分析 DB (DuckDB)。
# 運用 DB (SQLite) は sqlite 拡張で読み取り専用に ATTACH する。
# パスは src/analytics/build.py が環境変数で渡す (SEC_DUCKDB_PATH は差し替え前の一時ファイル security_build_<ランダム>.duckdb)。
security_platform:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('SEC_DUCKDB_PATH') }}"
      extensions:
        - sqlite
      # スナップショットの dbt_valid_from などはタイムゾーンなしの timestamp で入る。
      # ホスト (JST) とコンテナ (UTC) で 9 時間ずれないよう、セッションを UTC に固定する
      # メモリの上限。Mac mini の Docker は 8GB を gateway 一式などと分け合うので、既定 (8 割) のままだと
      # intel.db を読むスナップショットで Docker 全体が足りなくなり dbt が OOM で落ちる。超えた分はディスクに逃がす
      settings:
        TimeZone: UTC
        memory_limit: "{{ env_var('SEC_DUCKDB_MEMORY_LIMIT', '1536MB') }}"
      attach:
        - path: "{{ env_var('SEC_DATA_DIR') }}/intel.db"
          alias: intel
          type: sqlite
          read_only: true
        - path: "{{ env_var('SEC_DATA_DIR') }}/detection.db"
          alias: detection
          type: sqlite
          read_only: true
        - path: "{{ env_var('SEC_DATA_DIR') }}/remediation.db"
          alias: remediation
          type: sqlite
          read_only: true
      threads: 4
