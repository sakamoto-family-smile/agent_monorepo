# 脆弱性対応フレームワーク (ローカル常駐)。Docker Compose v2.24 以降が必要 (env_file の required)
#
#   make up                          # 起動 (= mkdir -p data && HOST_UID/HOST_GID を渡して docker compose up -d --build)
#                                    # 初回は intel がブートストラップから始める
#   docker compose logs -f intel
#   make duck-ui                     # ホスト側で DuckDB UI を開く
#
# SQLite の書き込みプロセスは 1 ファイルにつき 1 つ (intel.db は intel サービスだけが書く)。
# 手動実行 (make intel-* / make analytics) も docker compose run で同じ VM の中から行う。
# ホストの macOS から SQLite を直接書くと、VM をまたいだ WAL 共有になり壊れる恐れがある。
# data/ はホストにバインドするので、DuckDB (読み取り専用) はホストから直接開ける。
#
# コンテナに渡す環境変数は config/vuln.env だけ (config/.env の API キー等は渡さない)。
# 雛形: config/vuln.env.example
x-app: &app
  build:
    context: .
    dockerfile: infra/Dockerfile
  image: security-platform-vuln:local
  # ./data の所有者と揃える (make up が HOST_UID/HOST_GID を渡す。未指定なら 1000)
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes:
    - ./data:/app/data
  env_file:
    - path: config/vuln.env
      required: false
  environment:
    DATA_DIR: /app/data
    TZ: UTC
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  init: true  # SIGTERM を python に届け、ジョブの区切りで止める
  stop_grace_period: 2m
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  migrate:
    <<: *app
    command: ["python", "-m", "src.common.migrate"]
    restart: "no"

  intel:
    <<: *app
    command: ["python", "-m", "src.intel", "serve"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # A2: lockfile・本番イメージの SBOM の照合。モノレポを読み取り専用でマウントし、外部とは通信させない
  # (通知は notify が detection.db の events を読んで送る)
  detection:
    <<: *app
    command: ["python", "-m", "src.detection", "serve"]
    restart: unless-stopped
    network_mode: none
    volumes:
      - ./data:/app/data
      - ..:/repo:ro
    environment:
      DATA_DIR: /app/data
      TZ: UTC
      REPO_DIR: /repo
      SERVICES_PATH: /repo/security-platform/config/services.yaml
    depends_on:
      migrate:
        condition: service_completed_successfully

  analytics:
    <<: *app
    command: ["python", "-m", "src.analytics", "serve"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # 通知: P1 の即時通知・取得停止の監視・日次まとめ (LINE)、GitHub Issues (private リポジトリ)。
  # 外部と通信するのはこのサービスだけで、送り先の認証情報 (config/notify.env) もここにだけ渡す。
  # notify.db にだけ書き、detection.db・intel.db は読み取り専用で開く
  notify:
    <<: *app
    command: ["python", "-m", "src.notify", "serve"]
    restart: unless-stopped
    env_file:
      - path: config/vuln.env
        required: false
      - path: config/notify.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # L3 で追加:
  # remediation: python -m src.remediation serve  (remediation.db の唯一の書き込み元)
