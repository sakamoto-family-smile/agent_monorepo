[project]
name = "security-platform"
version = "0.1.0"
description = "Agent Security Platform - MCP/Skill/Agent security monitoring"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # asyncio extra: greenlet を全プラットフォームで入れる (既定のマーカーは macOS arm64 を除外する)
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "apscheduler>=3.10.0",
    "jinja2>=3.1.4",
    "anthropic>=0.30.0",
    "google-genai>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "line-bot-sdk>=3.11.0",
    "alembic>=1.20.1",
    "cvss>=3.6",
    "duckdb>=2.0.0",
    "dbt-duckdb>=1.11.0",
    # 2026.10.23 で emSign ECC Root CA - G3 (eMudhra の中間 CA 鍵漏洩) が除かれた。これより古い版に戻さない
    "certifi>=2026.10.23",
]

[project.scripts]
security-platform = "src.dashboard.app:main"
security-collector = "src.collector.main:main"
security-analyzer = "src.analyzer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
anyio_backend = "asyncio"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "anyio[trio]>=4.4.0",
    "httpx>=0.27.0",
]
