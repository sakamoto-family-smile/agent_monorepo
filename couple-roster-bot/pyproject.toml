[project]
name = "couple-roster-bot"
version = "0.1.0"
description = "夫婦で使う名簿管理システム — LINE (LIFF) × Google スプレッドシート。CSV 一括インポートと OCR 読み取り対応。"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "line-bot-sdk>=3.11.0",
]

[project.optional-dependencies]
# 本番ストレージ: Google スプレッドシート。
sheets = [
    "gspread>=6.0.0",
    "google-auth>=2.30.0",
]
# OCR: 無料の Google Drive OCR。
ocr-drive = [
    "google-api-python-client>=2.130.0",
    "google-auth>=2.30.0",
]
# OCR: 高精度の Cloud Vision。
ocr-vision = [
    "google-cloud-vision>=3.7.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "anyio[trio]>=4.4.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
