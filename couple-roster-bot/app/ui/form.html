<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>名簿を登録</title>
  <style>
    :root {
      --accent: #127c5a;
      --accent-ink: #0c5b41;
      --paper: #f7f5f0;
      --surface: #ffffff;
      --ink: #1e2420;
      --ink-soft: #52605a;
      --line: #e1ddd2;
      --danger: #c2410c;
      --ok: #127c5a;
      --radius: 12px;
      --sans: "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: var(--sans); line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 520px; margin: 0 auto; padding: 24px 18px 64px; }
    header h1 { font-size: 1.4rem; margin: 4px 0 2px; letter-spacing: 0.02em; }
    header p { margin: 0 0 20px; color: var(--ink-soft); font-size: 0.9rem; }
    form { display: flex; flex-direction: column; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.85rem; font-weight: 700; color: var(--ink); }
    label .req { color: var(--danger); font-size: 0.75rem; margin-left: 4px; }
    input, select, textarea {
      font: inherit; color: var(--ink); background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 12px 14px; width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(18, 124, 90, 0.15);
    }
    textarea { resize: vertical; min-height: 64px; }
    .zip-row { display: flex; gap: 8px; align-items: end; }
    .zip-row .field { flex: 1; }
    button {
      font: inherit; font-weight: 700; cursor: pointer; border: none;
      border-radius: var(--radius); padding: 12px 16px;
    }
    .btn-secondary {
      background: var(--surface); color: var(--accent-ink);
      border: 1px solid var(--accent); white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: #fff; padding: 14px; font-size: 1rem; margin-top: 4px; }
    .btn-primary:disabled { opacity: 0.55; cursor: default; }
    .msg { padding: 12px 14px; border-radius: var(--radius); font-size: 0.9rem; display: none; }
    .msg.show { display: block; }
    .msg.ok { background: #eaf3ee; color: var(--ok); }
    .msg.err { background: #fbeae0; color: var(--danger); }
    .hint { font-size: 0.78rem; color: var(--ink-soft); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>名簿を登録</h1>
      <p>名前・住所・間柄を入力して保存します。</p>
    </header>

    <div id="message" class="msg" role="status"></div>

    <form id="entry-form" novalidate>
      <div class="field">
        <label for="name">名前 <span class="req">必須</span></label>
        <input id="name" name="name" type="text" autocomplete="name" required />
      </div>

      <div class="field">
        <label for="kana">ふりがな</label>
        <input id="kana" name="kana" type="text" />
      </div>

      <div class="zip-row">
        <div class="field">
          <label for="zip">郵便番号</label>
          <input id="zip" name="zip" type="text" inputmode="numeric" placeholder="100-0001" />
        </div>
        <button type="button" id="zip-lookup" class="btn-secondary">住所検索</button>
      </div>

      <div class="field">
        <label for="address">住所 <span class="req">必須</span></label>
        <input id="address" name="address" type="text" autocomplete="street-address" required />
      </div>

      <div class="field">
        <label for="relation">家族の間柄 <span class="req">必須</span></label>
        <select id="relation" name="relation" required>
          <option value="">選択してください</option>
        </select>
      </div>

      <div class="field">
        <label for="note">メモ</label>
        <textarea id="note" name="note" placeholder="電話番号・補足など"></textarea>
      </div>

      <button type="submit" id="submit" class="btn-primary">この内容で登録</button>
      <p class="hint">※ 登録内容は夫婦で共有されます。</p>
    </form>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = "{{LIFF_ID}}";
    let lineUserId = "";

    const $ = (id) => document.getElementById(id);
    const msg = $("message");

    function showMessage(text, kind) {
      msg.textContent = text;
      msg.className = "msg show " + kind;
    }

    function prefillFromQuery() {
      const p = new URLSearchParams(location.search);
      for (const key of ["name", "kana", "zip", "address", "relation", "note"]) {
        const v = p.get(key);
        if (v) $(key).value = v;
      }
    }

    async function loadRelations() {
      try {
        const res = await fetch("/api/relations");
        const body = await res.json();
        const sel = $("relation");
        const preset = $("relation").value;
        for (const label of body.data || []) {
          const opt = document.createElement("option");
          opt.value = label;
          opt.textContent = label;
          sel.appendChild(opt);
        }
        // prefill 済みの値があれば選択状態に戻す
        const p = new URLSearchParams(location.search).get("relation");
        if (p) sel.value = p;
        else if (preset) sel.value = preset;
      } catch (e) {
        showMessage("間柄の選択肢を読み込めませんでした。", "err");
      }
    }

    async function lookupAddress() {
      const zip = $("zip").value.replace(/[^0-9]/g, "");
      if (zip.length !== 7) {
        showMessage("郵便番号は 7 桁で入力してください。", "err");
        return;
      }
      try {
        const res = await fetch(
          "https://zipcloud.ibsnet.co.jp/api/search?zipcode=" + zip
        );
        const body = await res.json();
        if (body.results && body.results[0]) {
          const r = body.results[0];
          $("address").value = r.address1 + r.address2 + r.address3;
          $("zip").value = zip.slice(0, 3) + "-" + zip.slice(3);
          msg.className = "msg";
        } else {
          showMessage("該当する住所が見つかりませんでした。", "err");
        }
      } catch (e) {
        showMessage("住所検索に失敗しました。", "err");
      }
    }

    async function initLiff() {
      if (!LIFF_ID || typeof liff === "undefined") return;
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          lineUserId = profile.userId || "";
        }
      } catch (e) {
        // LIFF 未設定でもフォーム自体は使えるようにする
      }
    }

    async function submitForm(ev) {
      ev.preventDefault();
      const submit = $("submit");
      submit.disabled = true;
      const payload = {
        name: $("name").value,
        kana: $("kana").value,
        zip: $("zip").value,
        address: $("address").value,
        relation: $("relation").value,
        note: $("note").value,
        created_by: lineUserId,
      };
      try {
        const res = await fetch("/api/entries", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const body = await res.json();
        if (res.ok && body.success) {
          showMessage("✅ 登録しました。", "ok");
          $("entry-form").reset();
          if (typeof liff !== "undefined" && liff.isInClient && liff.isInClient()) {
            setTimeout(() => liff.closeWindow(), 900);
          }
        } else {
          showMessage("⚠️ " + (body.error || "登録に失敗しました。"), "err");
        }
      } catch (e) {
        showMessage("通信エラーが発生しました。", "err");
      } finally {
        submit.disabled = false;
      }
    }

    prefillFromQuery();
    loadRelations();
    initLiff();
    $("zip-lookup").addEventListener("click", lookupAddress);
    $("entry-form").addEventListener("submit", submitForm);
  </script>
</body>
</html>
