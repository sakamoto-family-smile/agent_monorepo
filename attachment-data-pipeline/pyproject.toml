[project]
name = "attachment-data-pipeline"
version = "0.1.0"
description = "非構造化テキスト → 構造化テーブル変換の高Precision抽出/検証パイプライン (精度検証ハーネス)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6.0",
    "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
# 実LLM抽出器を使う場合のみ。検証層・合成データ・モック抽出器は LLM 非依存で動く。
llm = [
    "llm-client",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attachment_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]
