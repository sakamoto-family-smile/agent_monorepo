[project]
name = "video-understanding"
version = "0.1.0"
description = "YouTube やローカルの動画から、時刻つきのコマ一覧画像と字幕を取り出す CLI (PROPOSAL-0017)"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2026.10.26",
    "imageio-ffmpeg>=0.8.1",
    "pillow>=11.0",
    "fastmcp>=4.2",
]

[project.scripts]
video-understanding = "video_understanding.cli:main"
video-understanding-mcp = "video_understanding.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_understanding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: 実際に YouTube へ取りに行く (手動で `pytest -m network`)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.ruff.lint.isort]
known-local-folder = ["fakes"]
