# Cloud Build: fujisawa-platform ETL Cloud Run Job image を build → push する。
#
# Build context は **リポジトリルート** で起動する必要がある (Dockerfile が
# `COPY fujisawa-platform/pyproject.toml /app/` を行うため)。
#
# 起動例 (リポジトリルートから):
#   gcloud builds submit \
#     --config=fujisawa-platform/cloudbuild.yaml \
#     --ignore-file=fujisawa-platform/cloudbuild.gcloudignore \
#     --substitutions=_SHA=$(git rev-parse --short=7 HEAD) \
#     .
#
# substitutions:
#   _LOCATION  Artifact Registry location  (default asia-northeast1)
#   _REPO      Artifact Registry repo name (default fujisawa-etl)
#   _IMAGE     image name suffix           (default fujisawa-etl)
#   _SHA       short commit SHA。手動 build では `git rev-parse --short=7 HEAD` を渡す。
#              GitHub Trigger 経由なら built-in の SHORT_SHA を使う。
#
# 出力:
#   ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_SHA}

substitutions:
  _LOCATION: asia-northeast1
  _REPO: fujisawa-etl
  _IMAGE: fujisawa-etl
  _SHA: manual

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # 1. build (BuildKit 必須: Dockerfile が --mount=type=cache を使うため)
  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file=fujisawa-platform/Dockerfile
      - --tag=${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_SHA}
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - .

  # 2. push
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_SHA}

images:
  - ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_SHA}

timeout: 1800s
