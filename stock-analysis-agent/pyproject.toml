[project]
name = "stock-analysis-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    # DB: SQLAlchemy 2.0 async。dev/test は SQLite + aiosqlite、prod は Postgres + asyncpg。
    # (PROPOSAL-0011 P2-B: shared Cloud SQL 永続化)
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "rapidfuzz>=3.0.0",
    "claude-agent-sdk",
    "mplfinance>=0.12.9b0",
    "matplotlib>=3.9.0",
    "line-bot-sdk>=3.13",
    # PROPOSAL-0011 P3-A: Cloud Tasks 分散非同期 (webhook → worker run)
    "google-cloud-tasks>=2.16.0",
    # `[gcs]` extra で google-cloud-storage、`[pubsub]` extra で google-cloud-pubsub。
    # ANALYTICS_STORAGE_BACKEND=gcs のとき GCSPayloadWriter / GCSTransport、
    # =pubsub のとき PubSubSink (PROPOSAL-0010 P5-3) が import される。
    "analytics-platform[gcs,pubsub]",
    # EDINET API client (proposal 0006 Phase 1d / 2b)。 EDINET_ENABLED=true の
    # ときに orchestrator が edinet_collector 経由で 有価証券報告書 / 四半期報告書
    # を取得し、 `[xbrl]` extras の Arelle で Tier 1+2 構造化数値を抽出する。
    # 軽量 deploy で Arelle を入れたくない場合は EDINET_ENABLE_XBRL=false にして
    # extras を `edinet-client` (extras なし) に差し替える。
    "edinet-client[xbrl]",
]

[project.optional-dependencies]
# EDINET 書類本体を GCS に cache する場合に有効化 (Cloud Run 本番想定)。
edinet-gcs = [
    "edinet-client[gcs,xbrl]",
]

[tool.uv.sources]
analytics-platform = { path = "../analytics-platform" }
edinet-client = { path = "../edinet-client" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "anyio[trio]>=4.4.0",
    "httpx>=0.27.0",
]
