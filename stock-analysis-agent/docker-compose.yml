services:
  # MCP サーバー (Brave Search) — supergateway で stdio→HTTP SSE に変換
  mcp-brave-search:
    image: node:20-slim
    working_dir: /app
    environment:
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
    command: >
      sh -c "npm install -g supergateway @modelcontextprotocol/server-brave-search &&
             npx supergateway --stdio 'npx @modelcontextprotocol/server-brave-search' --port 3002 --outputTransport streamableHttp"
    expose:
      - "3002"
    restart: unless-stopped

  # Security Platform MCP Proxy — rate limiting, DLP, tool pinning
  security-proxy:
    build:
      context: ../security-platform
      dockerfile: infra/Dockerfile.proxy
    environment:
      - MCP_TARGET_URL=http://mcp-brave-search:3002
      - VERTEX_AI_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - VERTEX_AI_LOCATION=us-central1
      - LLM_PROVIDER=gemini
    ports:
      - "8082:8080"
    depends_on:
      - mcp-brave-search
    restart: unless-stopped

  # Stock Analysis Backend API
  #
  # PROPOSAL-0011 で Dockerfile を repo ルート context のマルチステージ build に
  # 変更したため、build context は親ディレクトリ (リポジトリルート)。
  # image には claude CLI + brave-search MCP が同梱されるので、MCP_PROXY_URL を
  # 設定しなければ npx in-process で brave を叩く (security-proxy 経由は任意)。
  backend:
    build:
      context: ..
      dockerfile: stock-analysis-agent/Dockerfile
    ports:
      - "8001:8080"
    environment:
      - APP_ENV=local
      - PORT=8080
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION:-us-east5}
      - DB_PATH=/app/data/stock_analysis.db
      - DATA_DIR=/app/data
      - CHARTS_DIR=/app/data/charts
      - REPORTS_DIR=/app/data/reports
      - CACHE_DIR=/app/data/cache
      - DICTIONARIES_DIR=/app/data/dictionaries
      - LOG_LEVEL=debug
      # チャート画像 / 全文 DL を返すなら公開 URL を入れる (ローカルは ngrok 等)
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # Security Platform MCP Proxy 経由にしたい場合のみ設定 (空なら npx in-process)
      - MCP_PROXY_URL=${MCP_PROXY_URL:-}
    volumes:
      - stock_data:/app/data
    restart: unless-stopped

volumes:
  stock_data:
