# Cloud Build: fujisawa-info-bot Cloud Run Service image を build → push する。
#
# Build context は **リポジトリルート** で起動する必要がある (Dockerfile が
# fujisawa-platform / llm-client / fujisawa-info-bot の 3 つを path dep として
# COPY するため)。
#
# 起動例 (リポジトリルートから):
#   gcloud builds submit \
#     --config=fujisawa-info-bot/cloudbuild.yaml \
#     --ignore-file=fujisawa-info-bot/cloudbuild.gcloudignore \
#     --substitutions=_SHA=$(git rev-parse --short=7 HEAD) \
#     .
#
# substitutions:
#   _LOCATION  Artifact Registry location  (default asia-northeast1)
#   _REPO      Artifact Registry repo name (default fujisawa-info-bot)
#   _IMAGE     image name suffix           (default fujisawa-info-bot)
#   _SHA       short commit SHA。 手動 build では `git rev-parse --short=7 HEAD` を渡す。
#
# 出力:
#   ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_SHA}

substitutions:
  _LOCATION: asia-northeast1
  _REPO: fujisawa-info-bot
  _IMAGE: fujisawa-info-bot
  _SHA: manual

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # 1. build (BuildKit 必須: Dockerfile が --mount=type=cache を使うため)
  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file=fujisawa-info-bot/Dockerfile
      - --tag=${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_SHA}
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - .

  # 2. push
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_SHA}

images:
  - ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_SHA}

timeout: 1200s
