[project]
name = "fujisawa-info-bot"
version = "0.1.0"
description = "藤沢市公式 HP を一次ソースとする LINE Bot エージェント (RAG + 出典 URL 付き回答 + 緊急情報 push)"
requires-python = ">=3.12"
# Phase 2 (LangGraph Supervisor + Intent Agent + RAG Agent) まで反映。
# Pub/Sub / Cloud Tasks / Firestore 等は Phase 3+ で必要時に追加。
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "line-bot-sdk>=3.11.0",
    # Phase 2: LangGraph Supervisor + Intent / RAG ノード。
    "langgraph>=0.2.0",
    # path dep: fujisawa-platform (proposal 0003) の knowledge_base / skills を
    # Phase 2 RAG で利用する。
    "fujisawa-platform",
    # path dep: llm-client (Vertex Anthropic Claude wrapper + Mock)。
    "llm-client",
]

[project.optional-dependencies]
# Vertex AI 経由の Anthropic Claude を本番起動時に有効化。
# 開発・テストは Mock LLM で完結するため default では入れない。
vertex = [
    "anthropic[vertex]>=0.40.0",
]

# 本番 RAG 用 Cloud SQL pgvector。 開発・テストは InMemoryStore + MockEmbedding
# で完結する。
pgvector = [
    "fujisawa-platform[pgvector,vertex]",
]

# Phase 3 (非同期 reply) / Phase 6 (Emergency push) で有効化。
async-pipeline = [
    "google-cloud-pubsub>=2.20.0",
    "google-cloud-tasks>=2.16.0",
]

# Phase 6 (RSS poll) で有効化。
rss = [
    "feedparser>=6.0.0",
]

# Firestore (Phase 1 で users / sessions、 Phase 6 で emergency_seen)
firestore = [
    "google-cloud-firestore>=2.16.0",
]

[tool.uv.sources]
# monorepo 内 path dep。 Cloud Run image build 時もリポジトリルートを context
# にする (driving-license-bot / fujisawa-platform と同パターン)。
fujisawa-platform = { path = "../fujisawa-platform" }
llm-client = { path = "../llm-client" }

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "anyio[trio]>=4.4.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
